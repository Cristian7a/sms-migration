<div class="ventana">
  <div class="ven_modal" id="_1">
    <div class="cerrar">
      <a href="javascript:cerrarventana('.ventana');">x</a>
    </div>

    <form method="post" id="form_rep" action="" name="form_rep">
      <h3>Nuevo Reporte:</h3>
      <hr />
      <table>
        <tr>
          <td>Área:</td>
          <td>
            <select id="area" name="area" required>
              <option value="">Cargando áreas...</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Empleado:</td>
          <td>
            <select id="emp" name="emp" required>
              <option value="">--ELEGIR ÁREA PRIMERO--</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Confidencial:</td>
          <td>
            <select id="con" name="con" required>
              <option value="0" selected>NO</option>
              <option value="1">SI</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Fecha del suceso:</td>
          <td><input type="date" id="fecsus" name="fecsus" required /></td>
        </tr>

        <tr>
          <td>Fecha del reporte:</td>
          <td><input type="date" id="fecrep" name="fecrep" required /></td>
        </tr>

        <tr>
          <td>Lugar del suceso:</td>
          <td>
            <select id="lugsus" name="lugsus" required>
              <option value="">Cargando lugares...</option>
            </select>
            <a href="javascript:openventana('.ventana_3');">Nuevo lugar</a>
          </td>
        </tr>

        <tr>
          <td>Descripción del evento:</td>
          <td>
            <textarea
              rows="4"
              cols="50"
              id="obs"
              name="obs"
              maxlength="300"
              required
            ></textarea>
          </td>
        </tr>

        <tr>
          <td>Frecuencia del evento:</td>
          <td>
            <select id="freeve" name="freeve" required>
              <option value="NINGUNA" selected>NINGUNA</option>
              <option value="ES LA PRIMERA VEZ">ES LA PRIMERA VEZ</option>
              <option value="EXTREMADAMENTE IMPROBABLE">
                EXTREMADAMENTE IMPROBABLE
              </option>
              <option value="IMPROBABLE">IMPROBABLE</option>
              <option value="REMOTO">REMOTO</option>
              <option value="OCASIONAL">OCASIONAL</option>
              <option value="FRECUENTE">FRECUENTE</option>
              <option value="PERMANENTE">PERMANENTE</option>
            </select>
          </td>
        </tr>

        <tr>
          <td></td>
          <td>
            <div class="buttons">
              <input
                type="submit"
                class="boton"
                value="Guardar"
                name="enviar"
                id="enviar"
              />
            </div>
          </td>
        </tr>
      </table>
    </form>
  </div>
</div>
