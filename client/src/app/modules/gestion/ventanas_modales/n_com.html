<div class="ven_modal" id="_3">
  <div class="cerrar">
    <a href="javascript:cerrarventana('.ventana_2');">x</a>
  </div>

  <form method="post" id="form_nuevo_riesgo" name="form_nuevo_riesgo">
    <input type="hidden" id="IDEREP_RIESGO" name="IDEREP_RIESGO" value="0" />

    <br /><br />
    <h3>Nuevo componente específico del peligro</h3>
    <hr />
    <table class="tabla_ven">
      <tr>
        <td width="180px">Componente específico:</td>
        <td width="300px">
          <input type="text" id="com" name="com" class="input-normal" />
        </td>
      </tr>
      <tr>
        <td>Descripción exacta:</td>
        <td><input type="text" id="des" name="des" class="input-normal" /></td>
      </tr>
      <tr>
        <td>Consecuencias:</td>
        <td>
          <input type="text" id="cons" name="cons" class="input-normal" />
        </td>
      </tr>
      <tr>
        <td>Probabilidad:</td>
        <td>
          <select id="pro" name="pro">
            <option value="">--elegir--</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Gravedad:</td>
        <td>
          <select id="gra" name="gra">
            <option value="">--elegir--</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <div class="buttons">
            <input
              type="submit"
              class="boton"
              value="Guardar"
              id="enviar_compo"
            />
          </div>
        </td>
      </tr>
    </table>
  </form>
</div>

<script src="js/nuevo_componente.js"></script>
